<svg width="1160" height="820" viewBox="0 0 1160 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f3eb"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ebe1"/>
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f5d76e"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- Decorative Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="20%" stop-color="#d4af37" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#d4af37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>

    <!-- Corner Decor -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="1140" height="800" rx="8" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Inner Border -->
  <rect x="25" y="25" width="1110" height="770" rx="4" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
  <rect x="35" y="35" width="1090" height="750" rx="2" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Decorative Top Lines -->
  <line x1="380" y1="45" x2="780" y2="45" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <line x1="400" y1="55" x2="760" y2="55" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Decorative Bottom Lines -->
  <line x1="400" y1="740" x2="760" y2="740" stroke="url(#lineGrad)" stroke-width="1"/>
  <line x1="380" y1="750" x2="780" y2="750" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <!-- Corner Ornaments -->
  <g stroke="#d4af37" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top-Left -->
    <path d="M45,45 L45,70 M45,45 L70,45"/>
    <path d="M45,45 L55,35 L65,45"/>
    <!-- Top-Right -->
    <path d="M1115,45 L1115,70 M1115,45 L1090,45"/>
    <path d="M1115,45 L1105,35 L1095,45"/>
    <!-- Bottom-Left -->
    <path d="M45,755 L45,730 M45,755 L70,755"/>
    <path d="M45,755 L55,765 L65,755"/>
    <!-- Bottom-Right -->
    <path d="M1115,755 L1115,730 M1115,755 L1090,755"/>
    <path d="M1115,755 L1105,765 L1095,755"/>
  </g>

  <!-- Header Section -->
  <g font-family="'Georgia', 'Times New Roman', serif">
    <!-- Company Logo / Name -->
    <text x="580" y="100" font-size="28" font-weight="bold" fill="#8b0000" text-anchor="middle" letter-spacing="6">eGai Soft</text>
    <text x="580" y="122" font-size="12" fill="#666666" text-anchor="middle" letter-spacing="2">(A Unit of eGai Soft Solutions Pvt. Ltd.)</text>
    
    <!-- Document Title -->
    <text x="580" y="180" font-size="32" font-weight="bold" fill="#1a1a1a" text-anchor="middle" letter-spacing="8">EXPERIENCE CERTIFICATE</text>
    <line x1="350" y1="195" x2="810" y2="195" stroke="#d4af37" stroke-width="2"/>
    
    <!-- Date -->
    <text x="950" y="180" font-size="13" fill="#555555" text-anchor="end" font-family="'Arial', sans-serif">Date: 30-06-2025</text>
  </g>

  <!-- Body Content -->
  <g font-family="'Palatino', 'Georgia', serif" fill="#2c2c2c">
    <!-- TO WHOM IT MAY CONCERN -->
    <text x="580" y="250" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="3" fill="#333333">TO WHOM IT MAY CONCERN</text>

    <!-- Main Text -->
    <text x="80" y="300" font-size="17" line-height="1.8">
      <tspan x="80" dy="0">This is to certify that</tspan>
    </text>

    <!-- Employee Name - Highlighted -->
    <text x="80" y="345" font-size="24" font-weight="bold" fill="#8b0000">
      <tspan>Miss. K. KOWSALYA</tspan>
    </text>
    <text x="80" y="370" font-size="16" fill="#444444">
      <tspan>(EMP.No: 0038)</tspan>
    </text>

    <text x="80" y="420" font-size="17" line-height="2.0">
      <tspan x="80" dy="0">is working with our Organization as a</tspan>
      <tspan x="80" dy="36" font-weight="bold" fill="#8b0000">Software Full Stack Developer</tspan>
      <tspan x="80" dy="36">since <tspan font-weight="bold">06-11-2024</tspan> to <tspan font-weight="bold">30-06-2025</tspan>.</tspan>
    </text>

    <text x="80" y="530" font-size="17" line-height="2.0">
      <tspan x="80" dy="0">She bears good character. She is honest &amp; hard working, and</tspan>
      <tspan x="80" dy="32">Organization does not have any dues towards her. We wish her</tspan>
      <tspan x="80" dy="32">a successful &amp; smooth life.</tspan>
    </text>

    <text x="80" y="660" font-size="17" font-style="italic">
      <tspan>We confirm all Information is true as per our record.</tspan>
    </text>
  </g>

  <!-- Footer Section -->
  <g font-family="'Georgia', 'Times New Roman', serif">
    <!-- Thanking You -->
    <text x="80" y="720" font-size="17" fill="#2c2c2c">Thanking you,</text>
    
    <!-- Yours Truly -->
    <text x="80" y="745" font-size="17" fill="#2c2c2c">Yours truly,</text>
    <text x="80" y="765" font-size="17" font-weight="bold" fill="#8b0000">For eGai Soft</text>

    <!-- Signature Line -->
    <line x1="750" y1="740" x2="1050" y2="740" stroke="#333333" stroke-width="1.5"/>
    <text x="900" y="760" font-size="13" fill="#555555" text-anchor="middle" font-family="'Arial', sans-serif">(Authorized Signatory)</text>

    <!-- Company Contact Details -->
    <text x="580" y="790" font-size="13" fill="#555555" text-anchor="middle" font-family="'Arial', sans-serif">
      <tspan>support@egaisoft.com</tspan>
      <tspan dx="20">|</tspan>
      <tspan dx="20">www.egaisoft.com</tspan>
    </text>
  </g>
</svg>
